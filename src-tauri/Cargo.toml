[package]
name = "dsh-desktop"
version = "0.2.1"
description = "DeepSeek Harness desktop shell: a Tauri + Rust window around the dsh web GUI"
authors = ["Alessandro Cyriaco"]
edition = "2021"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/AleCyriaco/deepseek-harness-desktop"
keywords = ["tauri", "desktop", "deepseek", "webview"]
categories = ["gui"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Builds the portable single-executable variant: the harness runtime and a
# Node interpreter are compressed into the binary and unpacked on first run.
# Off by default, because it makes the binary ~100 MB and the build far slower.
portable = ["dep:flate2"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
flate2 = "1"

[dependencies]
# `devtools` is enabled in release too: this window hosts a web UI, and
# without the inspector a client-side failure like "Failed to fetch" cannot be
# diagnosed at all from a shipped build.
# `unstable` enables multiple webviews in one window, which is how the status
# panel sits beside the harness without anything being injected into its page.
tauri = { version = "2", features = ["devtools", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
flate2 = { version = "1", optional = true }
# A single GET to DeepSeek's balance endpoint. `ureq` is blocking and small;
# the alternative was pulling a full async HTTP stack for one request.
ureq = { version = "2", features = ["json", "tls"], default-features = false }
# Balance refreshes are serialised through a tokio mutex; the network call
# itself runs on Tauri's blocking thread pool.
tokio = { version = "1", features = ["sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Directly used by the Linux multi-webview layout: Tauri packs child webviews
# into a vertical GTK box, so the shell reparents them into a gtk::Fixed that
# honours x/y/w/h bounds.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

# The release artifact is downloaded, installed and unpacked, and 34 % of the
# unstripped binary was symbol tables (`strip` alone measured 4.66 MB off the
# 13.7 MB file). `lto = "thin"` keeps most of the link-time benefit at a
# fraction of fat LTO's build cost. `panic = "abort"` is deliberately left off:
# `Backend`'s `Drop` is the cleanup backstop when nothing else runs.
[profile.release]
codegen-units = 1
lto = "thin"
strip = true
